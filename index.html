<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kahve Neden Defalarca Yasaklandı? — Test Yayını</title>
<style>
  :root { --paper:#F7F1E5; --ink:#1D1A17; --red:#B83A2B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  .tag { display:inline-block; background:var(--red); color:#fff; font:700 12px/1 system-ui,sans-serif; letter-spacing:.08em; padding:6px 10px; border-radius:3px; text-transform:uppercase; }
  h1 { font-size: clamp(28px, 5vw, 44px); line-height:1.1; margin: 14px 0 8px; }
  p.sub { margin:0 0 22px; color:#5a5148; font-size:17px; }
  video { width:100%; display:block; background:#000; border:3px solid var(--ink); border-radius:6px; box-shadow:6px 6px 0 var(--ink); }
  .meta { margin-top:26px; font:15px/1.5 system-ui,sans-serif; color:#5a5148; }
  .meta b { color:var(--ink); }
</style>
</head>
<body>
<main>
  <span class="tag">Test yayını · Taslak</span>
  <h1>Kahve Neden Defalarca Yasaklandı?</h1>
  <p class="sub">Video 001 — ilk tam kurgu (720p önizleme). Altyazılar CC düğmesinden açılır.</p>
  <video id="v" controls preload="metadata" poster="media/poster.jpg" playsinline>
    <source src="media/kahve-001-tr.mp4" type="video/mp4">
    <track kind="subtitles" src="media/kahve-001-tr.tr.vtt" srclang="tr" label="Türkçe">
    Tarayıcınız video öğesini desteklemiyor.
  </video>
  <p class="meta"><b>Süre:</b> 7 dk 35 sn &nbsp;·&nbsp; <b>Dil:</b> Türkçe &nbsp;·&nbsp; <b>Durum:</b> Taslak, herkese açık yayın değil.</p>
</main>
<script>
  // Altyazı ilk açılışta kapalı gelsin (Safari dahil); izleyici CC menüsünden açabilir.
  (function () {
    var v = document.getElementById('v');
    function off() { for (var i = 0; i < v.textTracks.length; i++) v.textTracks[i].mode = 'disabled'; }
    off();
    v.addEventListener('loadedmetadata', off);
    v.addEventListener('play', function once() { off(); v.removeEventListener('play', once); });
  })();
</script>
</body>
</html>
